name: CI

# Linux checks for every pull request and every push to master: unit tests,
# lint, the production renderer build and the browser regressions. Windows
# packaging is validated separately by windows-installer.yml. release.yml
# calls this workflow before it builds a release.
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Tests, lint, renderer build and browser regressions (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      # Nothing in this job launches Electron, so its binary is not downloaded.
      - name: Install locked dependencies
        run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci --no-audit --no-fund

      - name: Run regression tests
        run: npm test

      - name: Run regression tests in New York time with a German locale
        env:
          TZ: America/New_York
          LANG: de_DE.UTF-8
        # Node reads both from the environment, but an LC_ALL would override LANG:
        # stop rather than repeat the UTC, English run.
        run: |
          node -e "const { locale, timeZone } = Intl.DateTimeFormat().resolvedOptions(); if (locale !== 'de-DE' || timeZone !== 'America/New_York') throw new Error(locale + ' ' + timeZone)"
          npm test

      - name: Run lint
        run: npm run lint

      - name: Build production renderer
        run: npm run build:renderer

      # The Ubuntu mirror the runners use sometimes stops answering mid-download, and apt
      # then waits until the job's time limit. Give each request 30 s and retry it instead.
      - name: Make apt retry a stalled mirror instead of waiting
        run: printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-retry-stalled-mirror

      - name: Install browser test runtime
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium

      - name: Run browser regressions
        run: |
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5174 --strictPort &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          npx wait-on --timeout 30000 tcp:127.0.0.1:5174
          npm run test:ui

      # Only the production build carries the Content Security Policy and the
      # minified CSS; a CSP violation fails the run.
      - name: Run browser regressions on the production build
        run: |
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4174 --strictPort &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          npx wait-on --timeout 30000 tcp:127.0.0.1:4174
          UI_BASE_URL=http://127.0.0.1:4174 npm run test:ui
