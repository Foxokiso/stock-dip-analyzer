name: Native C++ core parity

on:
  push:
    branches: [feat/cpp-native-reengineering]
  pull_request:
    paths:
      - 'native/**'
      - 'scripts/verify-native-analysis.mjs'
      - 'src/utils/scoring.js'
      - '.github/workflows/native-core.yml'

permissions:
  contents: read

jobs:
  native-parity:
    name: C++ scoring parity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Configure C++ core and parity driver
        run: cmake -S native -B artifacts/native-build
      - name: Build
        run: cmake --build artifacts/native-build --config Release
      - name: Compare native calculations against reference
        run: ctest --test-dir artifacts/native-build -C Release --output-on-failure
