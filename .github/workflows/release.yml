name: Release

# Pushing a tag such as v2.2.0 builds, from that commit and once the checks
# every pull request runs have passed on it, the Windows installer and the
# Linux packages (a .deb and an AppImage, through linux-packages.yml), then
# publishes a GitHub Release with all of them and their SHA-256 sums attached.
# Only the publish job holds a write token: the build jobs run npm and
# electron-builder with read-only tokens and hand their files over as
# artifacts, and nothing is published unless every build succeeded.
# Code signing happens automatically once the CSC_LINK / CSC_KEY_PASSWORD
# secrets exist; until then the installer is unsigned and the release notes
# say so.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag that does not match package.json fails here within a minute, without
  # waiting for the checks below.
  version:
    name: Tag matches package.json
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Expressions reach scripts only through env, never spliced into the script text.
      - name: Tag must match package.json
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match package.json version $version" }

  # Before anything is built: CI's tests (also in New York time with a German
  # locale), lint, renderer build and browser regressions on the dev server and
  # the production build, and the native parity suites. They run with this
  # workflow's read-only token, and no secret is passed to them.
  checks:
    uses: ./.github/workflows/ci.yml
  native:
    uses: ./.github/workflows/native-core.yml

  windows:
    name: Build Windows x64 installer
    needs: [version, checks, native]
    runs-on: windows-2022
    timeout-minutes: 40
    outputs:
      signature-status: ${{ steps.checksums.outputs.signature-status }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          # No dependency cache in a job that holds a write token and the signing secrets.
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts=false --no-audit --no-fund

      - name: Tests, lint, renderer build
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'tests failed' }
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw 'lint failed' }
          npm run build:renderer
          if ($LASTEXITCODE -ne 0) { throw 'renderer build failed' }

      - name: Build installer
        # The signing secrets are set in this step's environment only. That is not
        # isolation: the job's earlier steps (npm install scripts, tests, lint, build)
        # share the runner, and electron-builder and every package it loads from
        # node_modules can read them. The job's token is read-only.
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: >-
          npm exec -- electron-builder --win nsis --x64 --publish never
          '-c.directories.output=release'
          '-c.nsis.artifactName=stock-dip-analyzer-${version}-${arch}-setup.${ext}'

      - name: Checksum and signing status
        id: checksums
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $installer = "release/stock-dip-analyzer-$($package.version)-x64-setup.exe"
          if (-not (Test-Path $installer)) { throw "installer missing: $installer" }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          $signature = (Get-AuthenticodeSignature -LiteralPath $installer).Status
          "signature-status=$signature" >> $env:GITHUB_OUTPUT
          "Installer $installer`nSHA-256 $hash`nAuthenticode: $signature" >> $env:GITHUB_STEP_SUMMARY

      - name: Hand the installer to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-installer
          path: |
            release/stock-dip-analyzer-*-x64-setup.exe
            release/stock-dip-analyzer-*-x64-setup.exe.blockmap
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  # Builds, checks and installs the .deb on Ubuntu 24.04, opens the installed app,
  # and hands the .deb and the AppImage over as the linux-x64-packages artifact.
  linux:
    name: Build Linux x64 packages
    needs: [version, checks, native]
    uses: ./.github/workflows/linux-packages.yml
    with:
      keep-packages: true

  publish:
    name: Publish GitHub Release
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job with write access, needed to create the release. It runs no npm
    # and no build tool: it downloads the built files, sums them and uploads them.
    permissions:
      contents: write
    steps:
      - name: Download the built installers and packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-x64-*'
          path: release
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          SIGNATURE_STATUS: ${{ needs.windows.outputs.signature-status }}
        run: |
          version="${TAG#v}"
          cd release
          files=(
            "stock-dip-analyzer-${version}-x64-setup.exe"
            "stock-dip-analyzer-${version}-x64-setup.exe.blockmap"
            "stock-dip-analyzer-${version}-amd64.deb"
            "stock-dip-analyzer-${version}-x86_64.AppImage"
          )
          for file in "${files[@]}"; do test -s "$file" || { echo "missing: $file"; exit 1; }; done
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIGNATURE_STATUS" = Valid ]; then
            signing="Authenticode status: Valid."
          else
            signing="Authenticode status: ${SIGNATURE_STATUS:-unknown} (unsigned: Windows SmartScreen will warn on first run; verify the SHA-256 in SHA256SUMS.txt)."
          fi
          cat > ../release-notes.md <<NOTES
          Built from ${COMMIT_SHA}. See CHANGELOG.md for what changed.

          **Windows x64:** run \`stock-dip-analyzer-${version}-x64-setup.exe\`. ${signing}

          **Ubuntu and Debian (x64):** download \`stock-dip-analyzer-${version}-amd64.deb\`, then run \`sudo apt install ./stock-dip-analyzer-${version}-amd64.deb\` in the folder you saved it to. Open **DDS response** from the app menu, or run \`stock-dip-analyzer\`. The package installs the AppArmor profile Ubuntu 24.04 needs for Chromium's sandbox.

          **Other Linux (x64):** \`stock-dip-analyzer-${version}-x86_64.AppImage\`: run \`chmod +x\` on it, then start it. It needs FUSE 2 (\`libfuse2\`, on Ubuntu 24.04 \`libfuse2t64\`), or run it with \`--appimage-extract-and-run\`. Where the system blocks user namespaces, as Ubuntu 24.04 does, the AppImage starts without Chromium's sandbox, so prefer the .deb there.

          SHA-256 sums of every file are in SHA256SUMS.txt.
          NOTES
          gh release create "$TAG" "${files[@]}" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Stock Dip Analyzer ${version}" \
            --notes-file ../release-notes.md \
            --verify-tag
