name: Release

# Pushing a tag such as v2.1.0 builds the Windows installer from that commit,
# runs the full test suite first, and publishes a GitHub Release with the
# installer, its block map and SHA-256 sums attached. Code signing happens
# automatically once the CSC_LINK / CSC_KEY_PASSWORD secrets exist; until then
# the installer is unsigned and the release notes say so.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and publish Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 40
    # Write access is needed only to create the release.
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          # No dependency cache in a job that holds a write token and the signing secrets.
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts=false --no-audit --no-fund

      # Expressions reach scripts only through env, never spliced into the script text.
      - name: Tag must match package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match package.json version $version" }

      - name: Tests, lint, renderer build
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'tests failed' }
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw 'lint failed' }
          npm run build:renderer
          if ($LASTEXITCODE -ne 0) { throw 'renderer build failed' }

      - name: Build installer
        # The signing secrets are set for this step only, not for npm ci or the tests;
        # electron-builder and every package it loads from node_modules can read them.
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: >-
          npm exec -- electron-builder --win nsis --x64 --publish never
          '-c.directories.output=release'
          '-c.nsis.artifactName=stock-dip-analyzer-${version}-${arch}-setup.${ext}'

      - name: Checksums and signing status
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $installer = "release/stock-dip-analyzer-$($package.version)-x64-setup.exe"
          if (-not (Test-Path $installer)) { throw "installer missing: $installer" }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          "$hash  $(Split-Path $installer -Leaf)" | Out-File -Encoding ascii release/SHA256SUMS.txt
          $signature = (Get-AuthenticodeSignature -LiteralPath $installer).Status
          "SIGNATURE_STATUS=$signature" >> $env:GITHUB_ENV
          "Installer $installer`nSHA-256 $hash`nAuthenticode: $signature" >> $env:GITHUB_STEP_SUMMARY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $notes = "Windows x64 installer built from $env:COMMIT_SHA.`n`nAuthenticode status: $env:SIGNATURE_STATUS" + $(if ($env:SIGNATURE_STATUS -ne 'Valid') { " (unsigned: Windows SmartScreen will warn on first run; verify the SHA-256 in SHA256SUMS.txt)." } else { "." }) + "`n`nSee CHANGELOG.md for what changed."
          gh release create "$env:TAG" `
            "release/stock-dip-analyzer-$($package.version)-x64-setup.exe" `
            "release/stock-dip-analyzer-$($package.version)-x64-setup.exe.blockmap" `
            release/SHA256SUMS.txt `
            --title "Stock Dip Analyzer $($package.version)" `
            --notes "$notes" `
            --verify-tag
