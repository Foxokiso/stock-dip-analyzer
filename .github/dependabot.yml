version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Electron on its own, so a Chromium or Node security update never waits
      # on an unrelated tooling change.
      electron:
        patterns: ['electron']
        update-types: [minor, patch]
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns: ['electron']
    ignore:
      # Moved by hand, after windows-installer.yml has validated NSIS packaging.
      - dependency-name: electron-builder
      # 7.1 reports new react-hooks/refs and set-state-in-effect errors; bump it
      # together with the code changes that clear them.
      - dependency-name: eslint-plugin-react-hooks
        versions: ['>=7.1.0']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
